name: PageLingo browser regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/browser-regression.yml"

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package E2E XPI
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path("dist/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          perms = data["browser_specific_settings"]["gecko"]["data_collection_permissions"]
          perms["required"] = ["websiteContent"]
          perms["optional"] = ["authenticationInfo"]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          npx web-ext build --source-dir dist --artifacts-dir artifacts --overwrite-dest
          PACKAGE="$(find artifacts -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$PACKAGE"
          cp "$PACKAGE" artifacts/pagelingo-browser-regression.xpi

      - name: Install CJK fonts
        shell: bash
        run: |
          if ! fc-list | grep -qi "Noto.*CJK"; then
            timeout 45s sudo apt-get update -qq || echo "CJK font package index refresh timed out; continuing"
            timeout 45s sudo apt-get install -y -qq fonts-noto-cjk || echo "CJK font install unavailable; continuing with runner fonts"
          fi

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Live OpenClaw + Claude regression
        run: python tests/live_ui_regression.py artifacts/pagelingo-browser-regression.xpi

      - name: Upload XPI and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagelingo-browser-regression
          path: |
            artifacts/pagelingo-browser-regression.xpi
            artifacts/model-picker.png
            artifacts/dynamic-ui-after.png
            artifacts/complex-splitter-after.png
            artifacts/openclaw-before.png
            artifacts/openclaw-after.png
            artifacts/claude-before.png
            artifacts/claude-after.png
          if-no-files-found: warn
          retention-days: 7
