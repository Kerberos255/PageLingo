name: Local LLM translation prompt benchmark

on:
  push:
    branches:
      - fix/github-font-size

permissions:
  contents: read

jobs:
  prompt-benchmark:
    if: "${{ github.event.head_commit.message == 'test: local llm prompt benchmark' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify PageLingo
        run: |
          npm ci
          npm run verify

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: browser-actions/setup-geckodriver@latest

      - name: Install benchmark dependencies
        run: python -m pip install selenium requests

      - name: Install and start LM Studio
        shell: bash
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
          LMS="$HOME/.lmstudio/bin/lms"
          "$LMS" daemon up
          sleep 5
          for i in $(seq 1 10); do
            "$LMS" server start --port 1234 && break
            sleep 2
          done
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:1234/api/v1/models >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Run prompt benchmark
        shell: bash
        run: |
          mkdir -p prompt-bench
          cat > /tmp/prompt_bench.py <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from selenium import webdriver
          from selenium.webdriver.firefox.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE="http://127.0.0.1:1234"
          OUT=Path("prompt-bench")
          SITES=[
            ("openclaw","https://docs.openclaw.ai/quickstart"),
            ("github","https://github.com/openclaw/openclaw"),
          ]
          MODELS=[
            ("qwen35-08b","https://huggingface.co/lmstudio-community/Qwen3.5-0.8B-GGUF",re.compile(r"0[.]8b",re.I)),
            ("qwen35-2b","https://huggingface.co/lmstudio-community/Qwen3.5-2B-GGUF",re.compile(r"(^|[^0-9])2b",re.I)),
          ]
          PROMPTS={
            "minimal": """Translate the English web text to natural Simplified Chinese. Every marker such as ⟦M0001⟧ or ⟦P0001⟧ is immutable: copy every marker exactly once and keep all markers in the same order. Return only the translation.""",
            "strict": """You are a deterministic website translation engine. Translate only human-readable English text into Simplified Chinese. Markers such as ⟦M0001⟧ and ⟦P0001⟧ are immutable placeholders. Copy every marker exactly once, character-for-character, in exactly the same order. Never add, remove, rename, split, merge, translate, or reorder markers. Do not invent facts, entities, context, explanations, Markdown, or wrapper text. Do not omit source meaning. Return only the translated marker text.""",
            "production": """Translate website UI and technical documentation from English into fluent, concise Simplified Chinese for a native Chinese reader. Preserve the source meaning, tone, qualifications, and technical intent; translate idioms naturally rather than word-for-word, but never add or omit information. Markers such as ⟦M0001⟧ and ⟦P0001⟧ represent protected structure or terms. Copy every marker exactly once and keep their order unchanged. Do not output explanations, Markdown, or any text other than the translation."""
          }
          MARKER_RE=re.compile(r"⟦[MP][0-9]{4}⟧")
          TAG_RE=re.compile(r"<[^>]+>")
          PROTECTED_HTML_RE=re.compile(r"<(code|kbd|samp|pre)\b[^>]*>.*?</\1\s*>",re.I|re.S)
          PROTECT_RE=re.compile(
            r"https?://[^\s<]+|"
            r"\b(?:OpenClaw|GitHub|Node[.]js|PowerShell|WebChat|WSL2|CLI|API|HTTP|HTTPS|JSON|YAML|npm|npx|Codex|Claude)\b|"
            r"\b[A-Za-z][A-Za-z0-9_.]*-[A-Za-z0-9_.-]+\b"
          )

          def api(path,method="GET",payload=None,timeout=180):
            r=requests.request(method,BASE+path,json=payload,timeout=timeout)
            if not r.ok: raise RuntimeError(f"{method} {path}: {r.status_code} {r.text[:600]}")
            return r.json()

          def unload():
            try:
              for m in api("/api/v1/models").get("models",[]):
                for inst in m.get("loaded_instances",[]) or []:
                  iid=inst.get("id") or inst.get("instance_id")
                  if iid: requests.post(BASE+"/api/v1/models/unload",json={"instance_id":iid},timeout=30)
            except Exception as e: print("UNLOAD_WARN",repr(e),flush=True)

          def download(repo,size_re):
            last=None
            for attempt in range(1,5):
              try:
                start=api("/api/v1/models/download","POST",{"model":repo,"quantization":"Q4_K_M"})
                if start.get("status") not in ("completed","already_downloaded"):
                  job=start.get("job_id")
                  if not job: raise RuntimeError("missing job id")
                  for _ in range(420):
                    s=api("/api/v1/models/download/status/"+job)
                    if s.get("status")=="completed": break
                    if s.get("status")=="failed": raise RuntimeError(json.dumps(s))
                    time.sleep(1)
                  else: raise RuntimeError("download timeout")
                for _ in range(120):
                  for m in api("/api/v1/models").get("models",[]):
                    desc=f"{m.get('key','')} {m.get('display_name','')}"
                    if m.get("type")=="llm" and "qwen3.5" in desc.lower() and size_re.search(desc): return m
                  time.sleep(1)
                raise RuntimeError("not indexed")
              except Exception as e:
                last=e; print("DOWNLOAD_RETRY",attempt,repr(e),flush=True); time.sleep(min(5*attempt,15))
            raise RuntimeError(f"download failed: {last}")

          def load(m):
            r=api("/api/v1/models/load","POST",{
              "model":m["key"],"context_length":8192,"flash_attention":False,
              "offload_kv_cache_to_gpu":False,"echo_load_config":True
            })
            if r.get("status")!="loaded": raise RuntimeError(json.dumps(r))
            return m["key"]

          def mark(html):
            mapping={}; n=[0]
            def tok(prefix,value):
              n[0]+=1; t=f"⟦{prefix}{n[0]:04d}⟧"; mapping[t]=value; return t
            s=PROTECTED_HTML_RE.sub(lambda m:tok("P",m.group(0)),html)
            parts=TAG_RE.split(s); tags=TAG_RE.findall(s); out=[]
            for i,p in enumerate(parts):
              if p: out.append(PROTECT_RE.sub(lambda m:tok("P",m.group(0)),p))
              if i<len(tags): out.append(tok("M",tags[i]))
            return "".join(out),mapping

          def collect():
            opts=Options(); opts.add_argument("-headless")
            d=webdriver.Firefox(options=opts); d.set_window_size(1440,1000)
            js=r"""
            const sels=["main h1","main h2","main h3","main p","main li","article h1","article h2","article h3","article p","article li",".markdown-body h1",".markdown-body h2",".markdown-body h3",".markdown-body p",".markdown-body li"];
            const out=[],seen=new Set();
            for(const sel of sels) for(const el of document.querySelectorAll(sel)){
              if(seen.has(el)||el.closest("nav,footer,aside,[role=navigation]"))continue;
              const r=el.getBoundingClientRect(),t=(el.innerText||"").trim().replace(/\s+/g," ");
              if(r.width<10||r.height<8||t.length<30||t.length>500||!/[A-Za-z]{3}/.test(t))continue;
              seen.add(el); out.push({text:t,html:el.innerHTML}); if(out.length>=6)return out;
            } return out;
            """
            rows=[]
            try:
              for name,url in SITES:
                d.get(url); WebDriverWait(d,40).until(lambda x:x.execute_script("return document.readyState")=="complete"); time.sleep(4)
                items=d.execute_script(js)
                for i,x in enumerate(items):
                  marked,_=mark(x["html"]); rows.append({"site":name,"index":i,"source":x["text"],"marked":marked})
            finally:d.quit()
            return rows

          corpus=collect()
          (OUT/"corpus.json").write_text(json.dumps(corpus,ensure_ascii=False,indent=2),encoding="utf-8")
          results=[]
          for label,repo,size_re in MODELS:
            unload(); model=download(repo,size_re); key=load(model)
            for prompt_name,prompt in PROMPTS.items():
              for row in corpus:
                expected=MARKER_RE.findall(row["marked"]); t0=time.perf_counter()
                resp=api("/api/v1/chat","POST",{
                  "model":key,"input":row["marked"],"system_prompt":prompt,
                  "temperature":0,"max_output_tokens":1024,"reasoning":"off",
                  "context_length":8192,"store":False
                })
                ms=(time.perf_counter()-t0)*1000
                output="\n".join(x.get("content","") for x in resp.get("output",[]) if x.get("type")=="message").strip()
                got=MARKER_RE.findall(output); stats=resp.get("stats",{})
                item={**row,"model":label,"model_size":model.get("size_bytes"),"prompt":prompt_name,
                      "output":output,"marker_ok":got==expected,"expected_markers":expected,"got_markers":got,
                      "ms":round(ms,1),"reasoning_tokens":stats.get("reasoning_output_tokens"),
                      "tokens_per_second":stats.get("tokens_per_second")}
                results.append(item); print("PROMPT_RESULT="+json.dumps(item,ensure_ascii=False,separators=(",",":")),flush=True)
            unload()
          summary=[]
          for label,_,_ in MODELS:
            for p in PROMPTS:
              xs=[x for x in results if x["model"]==label and x["prompt"]==p]
              summary.append({"model":label,"prompt":p,"cases":len(xs),"marker_pass":sum(x["marker_ok"] for x in xs),
                              "avg_ms":round(sum(x["ms"] for x in xs)/len(xs),1)})
          print("PROMPT_SUMMARY="+json.dumps(summary,ensure_ascii=False),flush=True)
          (OUT/"results.json").write_text(json.dumps({"summary":summary,"results":results},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          python /tmp/prompt_bench.py

      - name: Upload prompt benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-prompt-benchmark
          path: prompt-bench/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          lms server stop || true
          lms unload --all || true
          lms daemon down || true
