name: Marker translation live-site benchmark

on:
  push:
    branches:
      - fix/github-font-size

permissions:
  contents: read

jobs:
  marker-live:
    if: "${{ github.event.head_commit.message == 'test: marker live-site benchmark' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PageLingo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repo dependencies
        run: npm ci

      - name: Verify PageLingo
        run: npm run verify

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Install browser test dependencies
        run: python -m pip install selenium requests

      - name: Install and start LM Studio headless
        shell: bash
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
          LMS="$HOME/.lmstudio/bin/lms"
          "$LMS" daemon up
          sleep 5
          STARTED=0
          for i in $(seq 1 10); do
            if "$LMS" server start --port 1234; then
              STARTED=1
              break
            fi
            echo "LM Studio server start retry $i" >&2
            sleep 2
          done
          if [ "$STARTED" != "1" ]; then
            echo "LM Studio server command failed" >&2
            exit 1
          fi
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:1234/api/v1/models >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LM Studio server failed to become ready" >&2
          exit 1

      - name: Write marker benchmark
        shell: bash
        run: |
          mkdir -p marker-bench
          cat > /tmp/marker_live.py <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          import requests
          from selenium import webdriver
          from selenium.webdriver.firefox.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE = "http://127.0.0.1:1234"
          OUT = Path("marker-bench")
          OUT.mkdir(exist_ok=True)

          SITES = [
              ("openclaw", "https://docs.openclaw.ai/quickstart"),
              ("github", "https://github.com/openclaw/openclaw"),
          ]
          MODELS = [
              ("qwen35-08b", "https://huggingface.co/lmstudio-community/Qwen3.5-0.8B-GGUF", re.compile(r"0[.]8b", re.I)),
              ("qwen35-2b", "https://huggingface.co/lmstudio-community/Qwen3.5-2B-GGUF", re.compile(r"(^|[^0-9])2b", re.I)),
          ]

          SYSTEM = """You are a deterministic web-page translation engine.
          Translate the human-readable English text to natural Simplified Chinese (zh-Hans).
          The input contains immutable markers such as ⟦M0001⟧ and ⟦P0001⟧.
          Copy EVERY marker exactly once, character-for-character, and keep all markers in exactly the same order.
          Never add, remove, rename, split, merge, translate, or reorder a marker.
          Text represented by P markers is protected and must remain untouched.
          Do not invent facts or entities. Do not output Markdown fences, explanations, notes, or wrappers.
          Return only the translated marker text."""

          MARKER_RE = re.compile(r"⟦[MP][0-9]{4}⟧")
          TAG_RE = re.compile(r"<[^>]+>")
          PROTECTED_HTML_RE = re.compile(r"<(code|kbd|samp|pre)\b[^>]*>.*?</\1\s*>", re.I | re.S)
          PROTECT_RE = re.compile(
              r"https?://[^\s<]+|"
              r"\b(?:OpenClaw|GitHub|Node[.]js|PowerShell|WebChat|WSL2|CLI|API|HTTP|HTTPS|JSON|YAML|npm|npx|Codex|Claude)\b|"
              r"\b[A-Za-z][A-Za-z0-9_.]*-[A-Za-z0-9_.-]+\b"
          )

          def api(path, method="GET", payload=None, timeout=120):
              r = requests.request(method, BASE + path, json=payload, timeout=timeout)
              if not r.ok:
                  raise RuntimeError(f"{method} {path}: {r.status_code} {r.text[:1000]}")
              return r.json()

          def unload_all():
              try:
                  data = api("/api/v1/models")
                  for model in data.get("models", []):
                      for inst in model.get("loaded_instances", []) or []:
                          iid = inst.get("id") or inst.get("instance_id")
                          if iid:
                              requests.post(BASE + "/api/v1/models/unload", json={"instance_id": iid}, timeout=30)
              except Exception as e:
                  print("UNLOAD_WARN", repr(e), flush=True)

          def download_model(repo, size_re):
              start = api("/api/v1/models/download", "POST", {"model": repo, "quantization": "Q4_K_M"})
              if start.get("status") not in ("completed", "already_downloaded"):
                  job = start.get("job_id")
                  if not job:
                      raise RuntimeError("No download job: " + json.dumps(start))
                  for _ in range(360):
                      s = api("/api/v1/models/download/status/" + job)
                      if s.get("status") == "completed":
                          break
                      if s.get("status") == "failed":
                          raise RuntimeError("Download failed: " + json.dumps(s))
                      time.sleep(1)
                  else:
                      raise RuntimeError("Download timeout")
              for _ in range(90):
                  data = api("/api/v1/models")
                  for model in data.get("models", []):
                      desc = f"{model.get('key','')} {model.get('display_name','')}"
                      if model.get("type") == "llm" and "qwen3.5" in desc.lower() and size_re.search(desc):
                          return model
                  time.sleep(1)
              raise RuntimeError("Downloaded model not indexed")

          def load_model(model):
              result = api("/api/v1/models/load", "POST", {
                  "model": model["key"],
                  "context_length": 8192,
                  "flash_attention": False,
                  "offload_kv_cache_to_gpu": False,
                  "echo_load_config": True,
              }, timeout=180)
              if result.get("status") != "loaded":
                  raise RuntimeError("Load failed: " + json.dumps(result))
              return model["key"]

          def make_marker_html(html):
              mapping = {}
              counter = [0]

              def token(prefix, value):
                  counter[0] += 1
                  t = f"⟦{prefix}{counter[0]:04d}⟧"
                  mapping[t] = value
                  return t

              # Protect complete code-like elements first.
              marked = PROTECTED_HTML_RE.sub(lambda m: token("P", m.group(0)), html)

              # Protect URLs / technical terms in remaining human text.
              parts = TAG_RE.split(marked)
              tags = TAG_RE.findall(marked)
              rebuilt = []
              for i, part in enumerate(parts):
                  if part:
                      part = PROTECT_RE.sub(lambda m: token("P", m.group(0)), part)
                      rebuilt.append(part)
                  if i < len(tags):
                      rebuilt.append(token("M", tags[i]))
              marked = "".join(rebuilt)
              return marked, mapping

          def restore_markers(translated, mapping, expected_markers):
              got = MARKER_RE.findall(translated)
              if got != expected_markers:
                  return None, {"marker_ok": False, "expected": expected_markers, "got": got}
              restored = translated
              for marker, raw in mapping.items():
                  restored = restored.replace(marker, raw)
              if MARKER_RE.search(restored):
                  return None, {"marker_ok": False, "expected": expected_markers, "got": got, "reason": "unrestored_marker"}
              return restored, {"marker_ok": True, "expected": expected_markers, "got": got}

          def translate_batch(model_key, items):
              payload_parts = []
              for item in items:
                  payload_parts.append(f"⟦M900{item['batch_index']}⟧{item['marked']}⟦M910{item['batch_index']}⟧")
              text = "\n".join(payload_parts)
              expected = MARKER_RE.findall(text)
              t0 = time.perf_counter()
              result = api("/api/v1/chat", "POST", {
                  "model": model_key,
                  "input": text,
                  "system_prompt": SYSTEM,
                  "temperature": 0,
                  "max_output_tokens": 2048,
                  "reasoning": "off",
                  "context_length": 8192,
                  "store": False,
              }, timeout=180)
              ms = (time.perf_counter() - t0) * 1000
              messages = [x.get("content", "") for x in result.get("output", []) if x.get("type") == "message"]
              output = "\n".join(messages).strip()
              stats = result.get("stats", {})
              print("NATIVE_STATS", model_key, json.dumps({
                  "reasoning_tokens": stats.get("reasoning_output_tokens"),
                  "tokens_per_second": stats.get("tokens_per_second"),
                  "output_tokens": stats.get("total_output_tokens"),
              }), flush=True)
              got = MARKER_RE.findall(output)
              return output, expected, got, ms

          def firefox():
              opts = Options()
              opts.add_argument("-headless")
              opts.set_preference("intl.accept_languages", "en-US,en")
              opts.set_preference("browser.translations.automaticallyPopup", False)
              driver = webdriver.Firefox(options=opts)
              driver.set_window_size(1440, 1200)
              return driver

          COLLECT_JS = r"""
          const selectors = [
            "main h1","main h2","main h3","main p","main li",
            "article h1","article h2","article h3","article p","article li",
            ".markdown-body h1",".markdown-body h2",".markdown-body h3",".markdown-body p",".markdown-body li"
          ];
          const seen = new Set(), out = [];
          const visible = el => {
            const r = el.getBoundingClientRect(), s = getComputedStyle(el);
            return r.width > 10 && r.height > 8 && s.display !== "none" && s.visibility !== "hidden";
          };
          for (const sel of selectors) {
            for (const el of document.querySelectorAll(sel)) {
              if (seen.has(el) || !visible(el)) continue;
              const text = (el.innerText || "").trim().replace(/\s+/g," ");
              if (text.length < 18 || text.length > 650) continue;
              if (!/[A-Za-z]{3}/.test(text)) continue;
              if (el.closest("nav, footer, aside, [role=navigation]")) continue;
              seen.add(el);
              const id = "plb-" + out.length;
              el.dataset.pagelingoBenchId = id;
              const tags = [...el.querySelectorAll("*")].map(x => ({
                tag: x.tagName,
                href: x.getAttribute("href"),
                src: x.getAttribute("src"),
                cls: x.getAttribute("class")
              }));
              out.push({id, text, html: el.innerHTML, tags});
              if (out.length >= 16) return out;
            }
          }
          return out;
          """

          APPLY_JS = r"""
          const id=arguments[0], html=arguments[1];
          const el=document.querySelector('[data-pagelingo-bench-id="'+id+'"]');
          if(!el) return {found:false};
          el.innerHTML=html;
          const tags=[...el.querySelectorAll("*")].map(x=>({
            tag:x.tagName,
            href:x.getAttribute("href"),
            src:x.getAttribute("src"),
            cls:x.getAttribute("class")
          }));
          return {found:true,tags,text:(el.innerText||"").trim().replace(/\s+/g," ")};
          """

          def capture(driver, filename):
              driver.execute_script("window.scrollTo(0, 0)")
              time.sleep(1)
              driver.save_screenshot(str(OUT / filename))
              try:
                  driver.get_full_page_screenshot_as_file(str(OUT / ("full-" + filename)))
              except Exception as e:
                  print("FULL_SCREENSHOT_WARN", filename, repr(e), flush=True)

          def run_site(driver, site_name, url, model_label, model_key):
              print("SITE_START", model_label, site_name, url, flush=True)
              driver.get(url)
              WebDriverWait(driver, 40).until(lambda d: d.execute_script("return document.readyState") == "complete")
              time.sleep(5)
              items = driver.execute_script(COLLECT_JS)
              if len(items) < 4:
                  raise RuntimeError(f"Too few candidate blocks on {site_name}: {len(items)}")
              print("CANDIDATES", model_label, site_name, len(items), flush=True)

              if model_label == MODELS[0][0]:
                  capture(driver, f"{site_name}-original.png")

              prepared = []
              for idx, item in enumerate(items):
                  marked, mapping = make_marker_html(item["html"])
                  prepared.append({
                      **item,
                      "marked": marked,
                      "mapping": mapping,
                      "markers": MARKER_RE.findall(marked),
                      "batch_index": idx,
                  })

              results = []
              for start in range(0, len(prepared), 4):
                  batch = prepared[start:start+4]
                  # Batch wrapper IDs are simple digits 0..3 for parser stability.
                  for local_i, item in enumerate(batch):
                      item["batch_index"] = local_i
                  output, expected_batch, got_batch, ms = translate_batch(model_key, batch)
                  batch_ok = expected_batch == got_batch
                  print("BATCH", model_label, site_name, start, "marker_ok", batch_ok, "ms", round(ms,1), flush=True)

                  # Extract each batch section using immutable wrapper markers.
                  for local_i, item in enumerate(batch):
                      left = f"⟦M900{local_i}⟧"
                      right = f"⟦M910{local_i}⟧"
                      if left not in output or right not in output:
                          results.append({
                              "id": item["id"], "source": item["text"], "marker_ok": False,
                              "dom_ok": False, "reason": "missing_block_wrapper"
                          })
                          continue
                      segment = output.split(left,1)[1].split(right,1)[0]
                      restored, status = restore_markers(segment, item["mapping"], item["markers"])
                      if restored is None:
                          results.append({
                              "id": item["id"], "source": item["text"], "marker_ok": False,
                              "dom_ok": False, "reason": status
                          })
                          continue
                      applied = driver.execute_script(APPLY_JS, item["id"], restored)
                      dom_ok = bool(applied.get("found")) and applied.get("tags") == item["tags"]
                      results.append({
                          "id": item["id"], "source": item["text"], "translated": applied.get("text"),
                          "marker_ok": True, "dom_ok": dom_ok,
                          "tag_count": len(item["tags"]), "html_before": item["html"], "html_after": restored,
                      })

              capture(driver, f"{site_name}-{model_label}.png")
              ok_markers = sum(1 for x in results if x.get("marker_ok"))
              ok_dom = sum(1 for x in results if x.get("dom_ok"))
              summary = {
                  "site": site_name, "url": url, "model": model_label,
                  "blocks": len(results), "marker_pass": ok_markers, "dom_pass": ok_dom,
                  "results": results,
              }
              print("SITE_RESULT=" + json.dumps(summary, ensure_ascii=False, separators=(",",":")), flush=True)
              return summary

          all_results = []
          for label, repo, size_re in MODELS:
              unload_all()
              print("MODEL_DOWNLOAD", label, repo, flush=True)
              model = download_model(repo, size_re)
              print("MODEL_FOUND", label, json.dumps({k:model.get(k) for k in ("key","display_name","size_bytes")}), flush=True)
              key = load_model(model)
              driver = firefox()
              try:
                  for site_name, url in SITES:
                      all_results.append(run_site(driver, site_name, url, label, key))
              finally:
                  driver.quit()
              unload_all()

          (OUT / "results.json").write_text(json.dumps(all_results, ensure_ascii=False, indent=2), encoding="utf-8")
          compact = [{
              "site": x["site"], "model": x["model"], "blocks": x["blocks"],
              "marker_pass": x["marker_pass"], "dom_pass": x["dom_pass"]
          } for x in all_results]
          print("FINAL_MARKER_SUMMARY=" + json.dumps(compact, ensure_ascii=False), flush=True)
          PY
          python /tmp/marker_live.py

      - name: Upload benchmark screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-live-site-benchmark
          path: marker-bench/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          lms server stop || true
          lms unload --all || true
          lms daemon down || true
