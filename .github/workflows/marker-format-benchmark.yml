name: Marker format benchmark

on:
  push:
    branches:
      - fix/github-font-size

permissions:
  contents: read

jobs:
  marker-format:
    if: "${{ github.event.head_commit.message == 'test: marker format benchmark' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify PageLingo
        run: |
          npm ci
          npm run verify

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: browser-actions/setup-geckodriver@latest

      - name: Install benchmark dependencies
        run: python -m pip install selenium requests

      - name: Install and start LM Studio
        shell: bash
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
          LMS="$HOME/.lmstudio/bin/lms"
          "$LMS" daemon up
          sleep 5
          for i in $(seq 1 10); do
            "$LMS" server start --port 1234 && break
            sleep 2
          done
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:1234/api/v1/models >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Run marker format benchmark
        shell: bash
        run: |
          mkdir -p marker-format-bench
          cat > /tmp/marker_format.py <<'PY'
          import json, re, time
          from pathlib import Path
          import requests
          from selenium import webdriver
          from selenium.webdriver.firefox.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          BASE="http://127.0.0.1:1234"
          OUT=Path("marker-format-bench")
          SITES=[
            ("openclaw","https://docs.openclaw.ai/quickstart"),
            ("github","https://github.com/openclaw/openclaw"),
          ]
          FORMATS={
            "unicode": lambda kind,n: f"⟦{kind}{n:04d}⟧",
            "ascii": lambda kind,n: f"[[{kind}{n:04d}]]",
            "sentinel": lambda kind,n: f"__PL_{kind}{n:04d}__",
          }
          TAG_RE=re.compile(r"<[^>]+>")
          PROTECTED_HTML_RE=re.compile(r"<(code|kbd|samp|pre)\b[^>]*>.*?</\1\s*>",re.I|re.S)
          PROTECT_RE=re.compile(
            r"https?://[^\s<]+|"
            r"\b(?:OpenClaw|GitHub|Node[.]js|PowerShell|WebChat|WSL2|CLI|API|HTTP|HTTPS|JSON|YAML|npm|npx|Codex|Claude)\b|"
            r"\b[A-Za-z][A-Za-z0-9_.]*-[A-Za-z0-9_.-]+\b"
          )

          def api(path,method="GET",payload=None,timeout=180):
            r=requests.request(method,BASE+path,json=payload,timeout=timeout)
            if not r.ok: raise RuntimeError(f"{method} {path}: {r.status_code} {r.text[:800]}")
            return r.json()

          def unload():
            try:
              for m in api("/api/v1/models").get("models",[]):
                for inst in m.get("loaded_instances",[]) or []:
                  iid=inst.get("id") or inst.get("instance_id")
                  if iid: requests.post(BASE+"/api/v1/models/unload",json={"instance_id":iid},timeout=30)
            except Exception as e:
              print("UNLOAD_WARN",repr(e),flush=True)

          def download():
            repo="https://huggingface.co/lmstudio-community/Qwen3.5-2B-GGUF"
            last=None
            for attempt in range(1,5):
              try:
                start=api("/api/v1/models/download","POST",{"model":repo,"quantization":"Q4_K_M"})
                if start.get("status") not in ("completed","already_downloaded"):
                  job=start.get("job_id")
                  if not job: raise RuntimeError("missing download job")
                  for _ in range(480):
                    s=api("/api/v1/models/download/status/"+job)
                    if s.get("status")=="completed": break
                    if s.get("status")=="failed": raise RuntimeError(json.dumps(s))
                    time.sleep(1)
                  else: raise RuntimeError("download timeout")
                for _ in range(120):
                  for m in api("/api/v1/models").get("models",[]):
                    desc=f"{m.get('key','')} {m.get('display_name','')}"
                    if m.get("type")=="llm" and "qwen3.5" in desc.lower() and re.search(r"(^|[^0-9])2b",desc,re.I):
                      return m
                  time.sleep(1)
                raise RuntimeError("not indexed")
              except Exception as e:
                last=e; print("DOWNLOAD_RETRY",attempt,repr(e),flush=True); time.sleep(min(5*attempt,15))
            raise RuntimeError(f"download failed: {last}")

          def load(m):
            x=api("/api/v1/models/load","POST",{
              "model":m["key"],"context_length":8192,"flash_attention":False,
              "offload_kv_cache_to_gpu":False,"echo_load_config":True
            })
            if x.get("status")!="loaded": raise RuntimeError(json.dumps(x))
            return m["key"]

          def collect():
            opts=Options(); opts.add_argument("-headless")
            d=webdriver.Firefox(options=opts); d.set_window_size(1440,1000)
            js=r"""
            const sels=["main h1","main h2","main h3","main p","main li","article h1","article h2","article h3","article p","article li",".markdown-body h1",".markdown-body h2",".markdown-body h3",".markdown-body p",".markdown-body li"];
            const out=[],seen=new Set();
            for(const sel of sels) for(const el of document.querySelectorAll(sel)){
              if(seen.has(el)||el.closest("nav,footer,aside,[role=navigation]"))continue;
              const r=el.getBoundingClientRect(),t=(el.innerText||"").trim().replace(/\s+/g," ");
              if(r.width<10||r.height<8||t.length<30||t.length>500||!/[A-Za-z]{3}/.test(t))continue;
              seen.add(el); out.push({text:t,html:el.innerHTML}); if(out.length>=6)return out;
            } return out;
            """
            rows=[]
            try:
              for name,url in SITES:
                d.get(url); WebDriverWait(d,40).until(lambda x:x.execute_script("return document.readyState")=="complete"); time.sleep(4)
                for i,x in enumerate(d.execute_script(js)):
                  rows.append({"site":name,"index":i,"source":x["text"],"html":x["html"]})
            finally:d.quit()
            return rows

          def mark(html,fmt):
            mapping={}; n=[0]
            def tok(kind,value):
              n[0]+=1; t=FORMATS[fmt](kind,n[0]); mapping[t]=value; return t
            s=PROTECTED_HTML_RE.sub(lambda m:tok("P",m.group(0)),html)
            parts=TAG_RE.split(s); tags=TAG_RE.findall(s); out=[]
            for i,p in enumerate(parts):
              if p: out.append(PROTECT_RE.sub(lambda m:tok("P",m.group(0)),p))
              if i<len(tags): out.append(tok("M",tags[i]))
            return "".join(out),mapping

          def tokens(text,fmt):
            if fmt=="unicode": return re.findall(r"⟦[MP][0-9]{4}⟧",text)
            if fmt=="ascii": return re.findall(r"\[\[[MP][0-9]{4}\]\]",text)
            return re.findall(r"__PL_[MP][0-9]{4}__",text)

          corpus=collect()
          (OUT/"corpus.json").write_text(json.dumps(corpus,ensure_ascii=False,indent=2),encoding="utf-8")
          unload(); model=download(); key=load(model)
          rows=[]
          for fmt in FORMATS:
            example=FORMATS[fmt]("M",1)
            prompt=(
              "Translate English web text into natural Simplified Chinese. "
              f"Tokens like {example} are immutable placeholders. "
              "Copy every placeholder exactly once, character-for-character, and keep all placeholders in exactly the same order. "
              "Translate everything else faithfully. Do not add explanations or Markdown. Output only the translation."
            )
            for item in corpus:
              marked,_=mark(item["html"],fmt); expected=tokens(marked,fmt); t0=time.perf_counter()
              resp=api("/api/v1/chat","POST",{
                "model":key,"input":marked,"system_prompt":prompt,"temperature":0,
                "max_output_tokens":1024,"reasoning":"off","context_length":8192,"store":False
              })
              ms=(time.perf_counter()-t0)*1000
              out="\n".join(x.get("content","") for x in resp.get("output",[]) if x.get("type")=="message").strip()
              got=tokens(out,fmt)
              row={**item,"format":fmt,"marked":marked,"output":out,
                   "marker_ok":got==expected,"expected":expected,"got":got,"ms":round(ms,1)}
              rows.append(row); print("FORMAT_RESULT="+json.dumps(row,ensure_ascii=False,separators=(",",":")),flush=True)
          summary=[]
          for fmt in FORMATS:
            xs=[x for x in rows if x["format"]==fmt]
            summary.append({"format":fmt,"cases":len(xs),"marker_pass":sum(x["marker_ok"] for x in xs),
                            "avg_ms":round(sum(x["ms"] for x in xs)/len(xs),1)})
          print("FORMAT_SUMMARY="+json.dumps(summary,ensure_ascii=False),flush=True)
          (OUT/"results.json").write_text(json.dumps({"summary":summary,"results":rows},ensure_ascii=False,indent=2),encoding="utf-8")
          unload()
          PY
          python /tmp/marker_format.py

      - name: Upload marker format benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-format-benchmark
          path: marker-format-bench/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          lms server stop || true
          lms unload --all || true
          lms daemon down || true
