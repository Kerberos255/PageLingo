name: Translation model benchmark

on:
  push:
    branches:
      - fix/github-font-size

permissions:
  contents: read

jobs:
  benchmark:
    if: "${{ github.event.head_commit.message == 'test: translation model benchmark' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PageLingo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify PageLingo
        run: npm run verify

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Install Selenium and sacrebleu
        run: python -m pip install selenium sacrebleu

      - name: Prepare benchmark corpus
        shell: bash
        run: |
          cat > /tmp/corpus.json <<'EOF'
          [
            {"id":"ui","source":"Settings were saved successfully.","reference":"设置已成功保存。"},
            {"id":"news","source":"The central bank kept interest rates unchanged, saying inflation had eased but remained above its target.","reference":"央行维持利率不变，并表示通胀已经缓和，但仍高于其目标水平。"},
            {"id":"github","source":"This pull request fixes a race condition that could leave the cache in an inconsistent state after a failed retry.","reference":"这个拉取请求修复了一个竞态条件，该问题可能在重试失败后使缓存处于不一致状态。"},
            {"id":"docs","source":"If the server returns a 429 response, wait for the Retry-After interval before sending another request.","reference":"如果服务器返回 429 响应，请等待 Retry-After 指定的时间后再发送请求。"},
            {"id":"forum","source":"I thought the update would break everything, but honestly it runs way smoother than before.","reference":"我原以为这次更新会把一切搞坏，但说真的，它现在运行得比以前流畅多了。"},
            {"id":"game","source":"The old lighthouse keeper swears he saw blue fire dancing over the cliffs before the storm.","reference":"老灯塔看守人发誓说，暴风雨来临前他看见蓝色火焰在悬崖上跳动。"},
            {"id":"idiom","source":"That patch works in a pinch, but I wouldn't bet the farm on it.","reference":"那个补丁应急时能用，但我绝不会把全部希望都押在它上面。"},
            {"id":"html","source":"Click <strong>Save</strong> to keep your changes, or <a href=\"/docs\">read the documentation</a> for details.","reference":"点击<strong>保存</strong>以保留更改，或<a href=\"/docs\">阅读文档</a>了解详情。"},
            {"id":"product","source":"The app keeps your reading position in sync across devices, but it never uploads the contents of the pages you visit.","reference":"该应用会在不同设备之间同步你的阅读进度，但绝不会上传你访问页面的内容。"},
            {"id":"long","source":"After the migration finished, the dashboard looked normal at first. A few minutes later, however, several background jobs began retrying at once, which caused the queue to grow much faster than expected.","reference":"迁移完成后，仪表板起初看起来一切正常。然而几分钟后，多个后台任务同时开始重试，导致队列增长速度远超预期。"}
          ]
          EOF

      - name: Prepare Firefox Bergamot model
        shell: bash
        run: |
          mkdir -p bench-assets
          curl -fsSL 'https://firefox-settings-attachments.cdn.mozilla.net/main-workspace/translations-models-v2/321191b6-2c42-4bca-84ec-b7b074b67bd6.zst' -o /tmp/model.zst
          curl -fsSL 'https://firefox-settings-attachments.cdn.mozilla.net/main-workspace/translations-models-v2/900beaed-2dba-4a88-ad7c-852ec9e73f6a.zst' -o /tmp/lex.zst
          curl -fsSL 'https://firefox-settings-attachments.cdn.mozilla.net/main-workspace/translations-models-v2/83278466-fec4-4944-a99d-c2372fa9de88.zst' -o /tmp/srcvocab.zst
          curl -fsSL 'https://firefox-settings-attachments.cdn.mozilla.net/main-workspace/translations-models-v2/84236654-1b66-42fc-9ba2-74c37f27e5eb.zst' -o /tmp/trgvocab.zst
          cat > decompress.mjs <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";
          import { decompress } from "fzstd";
          const assets = [
            ["model", 43849787],
            ["lex", 6506248],
            ["srcvocab", 806952],
            ["trgvocab", 772004],
          ];
          for (const [name, size] of assets) {
            const compressed = new Uint8Array(await readFile(`/tmp/${name}.zst`));
            const out = decompress(compressed, new Uint8Array(size));
            if (out.byteLength !== size) throw new Error(`${name}: expected ${size}, got ${out.byteLength}`);
            await writeFile(`bench-assets/${name}.bin`, out);
          }
          EOF
          node decompress.mjs

          cat > bergamot-bench-worker.js <<'EOF'
          importScripts("/vendor/bergamot/bergamot-translator.js");
          let engine = null;
          function textConfig(entries) {
            const indent = "            ";
            let result = "\n";
            for (const [key, value] of Object.entries(entries)) result += `${indent}${key}: ${value}\n`;
            return result + indent;
          }
          async function runtime() {
            const wasmBinary = await (await fetch("/vendor/bergamot/bergamot-translator-v4.wasm")).arrayBuffer();
            return new Promise((resolve, reject) => {
              let module;
              module = loadBergamot({
                INITIAL_MEMORY: 41943040,
                wasmBinary,
                print: () => {},
                printErr: () => {},
                onAbort: r => reject(new Error(String(r))),
                onRuntimeInitialized: () => resolve(module),
              });
            });
          }
          async function raw(name) { return await (await fetch(`/bench-assets/${name}.bin`)).arrayBuffer(); }
          function alloc(b, buffer, alignment) {
            const m = new b.AlignedMemory(buffer.byteLength, alignment);
            m.getByteArrayView().set(new Uint8Array(buffer));
            return m;
          }
          async function init() {
            const b = await runtime();
            const model = await raw("model");
            const lex = await raw("lex");
            const srcvocab = await raw("srcvocab");
            const trgvocab = await raw("trgvocab");
            const vocabs = new b.AlignedMemoryList();
            vocabs.push_back(alloc(b, srcvocab, 64));
            vocabs.push_back(alloc(b, trgvocab, 64));
            const config = textConfig({
              "beam-size":"1","normalize":"1.0","word-penalty":"0","max-length-break":"128",
              "mini-batch-words":"1024","workspace":"128","max-length-factor":"2.0","skip-cost":"true",
              "cpu-threads":"0","quiet":"true","quiet-translation":"true",
              "gemm-precision":"int8shiftAlphaAll","alignment":"soft"
            });
            const tm = new b.TranslationModel("en","zh-Hans",config,alloc(b,model,256),alloc(b,lex,64),vocabs,null);
            engine = { b, tm, service:new b.BlockingService({cacheSize:0}) };
          }
          function tags(s) { return [...s.matchAll(/<\/?[A-Za-z][^>]*>/g)].map(m=>m[0].replace(/\s+/g," ")); }
          function translate(html) {
            const {b,tm,service}=engine;
            const messages=new b.VectorString(); const opts=new b.VectorResponseOptions(); let responses=null;
            try {
              messages.push_back(html); opts.push_back({qualityScores:false,alignment:true,html:true});
              const t0=performance.now();
              responses=service.translate(tm,messages,opts);
              const ms=performance.now()-t0;
              const output=responses.get(0).getTranslatedText();
              return {output,ms,html_ok:JSON.stringify(tags(html))===JSON.stringify(tags(output))};
            } finally { responses?.delete?.(); messages.delete(); opts.delete(); }
          }
          onmessage=async e=>{
            try {
              if(!engine) await init();
              const rows=e.data.map(x=>({id:x.id,...translate(x.source)}));
              postMessage({ok:true,rows});
            } catch(err) { postMessage({ok:false,error:String(err?.stack||err)}); }
          };
          EOF
          cat > bergamot-bench.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Bergamot benchmark</title>
          EOF

      - name: Run Firefox Bergamot benchmark
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/bench-http.log 2>&1 &
          echo $! > /tmp/http.pid
          cat > /tmp/run_bergamot.py <<'EOF'
          import json, os, time
          from selenium import webdriver
          from selenium.webdriver.firefox.options import Options
          corpus=json.load(open("/tmp/corpus.json"))
          opts=Options(); opts.add_argument("-headless")
          driver=webdriver.Firefox(options=opts)
          try:
              driver.get("http://127.0.0.1:8765/bergamot-bench.html")
              script="""
              const done=arguments[arguments.length-1], corpus=arguments[0];
              const w=new Worker('/bergamot-bench-worker.js');
              w.onmessage=e=>done(e.data);
              w.onerror=e=>done({ok:false,error:e.message});
              w.postMessage(corpus);
              """
              driver.set_script_timeout(180)
              result=driver.execute_async_script(script, corpus)
              if not result.get("ok"): raise RuntimeError(result)
              with open("/tmp/bergamot.json","w") as f: json.dump(result["rows"],f,ensure_ascii=False)
              print("BENCH_BERGAMOT="+json.dumps(result["rows"],ensure_ascii=False,separators=(",",":")))
          finally:
              driver.quit()
          EOF
          python /tmp/run_bergamot.py
          kill "$(cat /tmp/http.pid)" || true

      - name: Install LM Studio llmster
        shell: bash
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
          "$HOME/.lmstudio/bin/lms" --help >/dev/null

      - name: Start LM Studio
        shell: bash
        run: |
          lms daemon up
          lms server start --port 1234
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:1234/api/v1/models >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Prepare LM benchmark helper
        shell: bash
        run: |
          cat > /tmp/lmbench.mjs <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";
          const corpus=JSON.parse(await readFile("/tmp/corpus.json","utf8"));
          const base="http://127.0.0.1:1234";
          async function jfetch(url, init={}) {
            const r=await fetch(url,init);
            if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
            return await r.json();
          }
          async function download(repo, quant="Q4_K_M") {
            const start=await jfetch(base+"/api/v1/models/download",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:repo,quantization:quant})});
            if(start.status!=="completed" && start.status!=="already_downloaded") {
              if(!start.job_id) throw new Error("no download job: "+JSON.stringify(start));
              for(let i=0;i<300;i++) {
                const s=await jfetch(base+"/api/v1/models/download/status/"+start.job_id);
                if(s.status==="completed") break;
                if(s.status==="failed") throw new Error("download failed "+JSON.stringify(s));
                await new Promise(r=>setTimeout(r,1000));
                if(i===299) throw new Error("download timeout");
              }
            }
            for(let i=0;i<60;i++) {
              const m=await jfetch(base+"/api/v1/models");
              const hit=(m.models||[]).find(x=>x.type==="llm" && /qwen2\.5/i.test((x.key||"")+" "+(x.display_name||"")) && ((repo.includes("1.5B") && /1\.5b/i.test((x.key||"")+" "+(x.display_name||""))) || (repo.includes("0.5B") && /0\.5b/i.test((x.key||"")+" "+(x.display_name||"")))));
              if(hit) return hit;
              await new Promise(r=>setTimeout(r,1000));
            }
            throw new Error("model not indexed");
          }
          async function unloadAll() {
            const m=await jfetch(base+"/api/v1/models");
            for(const x of (m.models||[])) for(const inst of (x.loaded_instances||[])) {
              await fetch(base+"/api/v1/models/unload",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({instance_id:inst.id||inst.instance_id})}).catch(()=>{});
            }
          }
          function tags(s) { return [...s.matchAll(/<\/?[A-Za-z][^>]*>/g)].map(m=>m[0].replace(/\s+/g," ")); }
          async function run(label, repo) {
            await unloadAll();
            const model=await download(repo);
            const loaded=await jfetch(base+"/api/v1/models/load",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:model.key,context_length:4096,flash_attention:false,offload_kv_cache_to_gpu:false,echo_load_config:true})});
            if(loaded.status!=="loaded") throw new Error("load failed "+JSON.stringify(loaded));
            const prompt="Translate the user HTML from English to Simplified Chinese. Preserve every HTML tag exactly. Output only translated HTML.";
            await jfetch(base+"/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:model.key,messages:[{role:"system",content:prompt},{role:"user",content:"Warm up."}],temperature:0,max_tokens:64})});
            const rows=[];
            for(const x of corpus) {
              const t0=performance.now();
              const out=await jfetch(base+"/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:model.key,messages:[{role:"system",content:prompt},{role:"user",content:x.source}],temperature:0,max_tokens:384})});
              const ms=performance.now()-t0;
              const output=out.choices?.[0]?.message?.content?.trim()||"";
              rows.push({id:x.id,output,ms,html_ok:JSON.stringify(tags(x.source))===JSON.stringify(tags(output))});
            }
            const result={label,model:model.key,size_bytes:model.size_bytes||null,rows};
            await writeFile(`/tmp/${label}.json`,JSON.stringify(result));
            console.log("BENCH_"+label.toUpperCase()+"="+JSON.stringify(result));
            await unloadAll();
          }
          await run(process.argv[2],process.argv[3]);
          EOF

      - name: Benchmark Qwen 0.5B
        run: node /tmp/lmbench.mjs qwen05 https://huggingface.co/lmstudio-community/Qwen2.5-0.5B-Instruct-GGUF

      - name: Benchmark Qwen 1.5B
        run: node /tmp/lmbench.mjs qwen15 https://huggingface.co/lmstudio-community/Qwen2.5-1.5B-Instruct-GGUF

      - name: Score and summarize
        shell: bash
        run: |
          cat > /tmp/score.py <<'EOF'
          import json,re,statistics
          from sacrebleu.metrics import CHRF
          corpus=json.load(open("/tmp/corpus.json"))
          refs={x["id"]:x["reference"] for x in corpus}
          chrf=CHRF(word_order=2)
          systems={}
          systems["bergamot"]={"rows":json.load(open("/tmp/bergamot.json")),"size_bytes":51934991}
          systems["qwen05"]=json.load(open("/tmp/qwen05.json"))
          systems["qwen15"]=json.load(open("/tmp/qwen15.json"))
          def strip(s): return re.sub(r"<[^>]+>","",s)
          summary={}
          for name,data in systems.items():
              rows=data["rows"]
              hyps=[strip(r["output"]) for r in rows]
              rfs=[strip(refs[r["id"]]) for r in rows]
              summary[name]={
                "size_bytes":data.get("size_bytes"),
                "avg_ms":round(statistics.mean(r["ms"] for r in rows),1),
                "median_ms":round(statistics.median(r["ms"] for r in rows),1),
                "html_pass":sum(1 for r in rows if r["html_ok"]),
                "count":len(rows),
                "chrf2":round(chrf.corpus_score(hyps,[rfs]).score,2)
              }
          print("BENCH_SUMMARY="+json.dumps(summary,ensure_ascii=False,separators=(",",":")))
          for x in corpus:
              print("\nCASE",x["id"],"SOURCE:",x["source"],"REFERENCE:",x["reference"])
              for name,data in systems.items():
                  row=next(r for r in data["rows"] if r["id"]==x["id"])
                  print(name,":",row["output"],"|",round(row["ms"],1),"ms","| html",row["html_ok"])
          EOF
          python /tmp/score.py

      - name: Cleanup LM Studio
        if: always()
        run: |
          lms server stop || true
          lms unload --all || true
          lms daemon down || true
