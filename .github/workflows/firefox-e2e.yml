name: Firefox E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firefox-e2e.yml"

permissions:
  contents: read
  issues: write

jobs:
  firefox-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and build
        run: npm run verify

      - name: AMO lint
        run: npx web-ext lint --source-dir dist

      - name: Build unsigned XPI
        run: |
          mkdir -p artifacts
          npx web-ext build --source-dir dist --artifacts-dir artifacts --overwrite-dest
          cp "$(find artifacts -maxdepth 1 -type f -name '*.zip' | head -n 1)" artifacts/PageLingo-e2e.xpi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Selenium client
        run: python -m pip install --disable-pip-version-check 'selenium==4.49.0'

      - name: Show Firefox toolchain
        run: |
          {
            firefox --version
            geckodriver --version
          } | tee artifacts/firefox-toolchain.txt

      - name: Run real Firefox extension test
        id: e2e
        run: |
          set +e
          python tests/e2e_firefox.py artifacts/PageLingo-e2e.xpi 2>&1 | tee artifacts/firefox-e2e.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload tested XPI and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PageLingo-firefox-e2e
          path: |
            artifacts/PageLingo-e2e.xpi
            artifacts/firefox-toolchain.txt
            artifacts/firefox-e2e.log
          if-no-files-found: warn

      - name: Publish readable E2E result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          code=${E2E_EXIT_CODE:-999}
          {
            echo "### Firefox E2E run ${RUN_ID}"
            echo
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Exit code: \`${code}\`"
            echo "- Time: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
            echo
            echo "#### Toolchain"
            echo '```text'
            cat artifacts/firefox-toolchain.txt 2>/dev/null || echo "toolchain output unavailable"
            echo '```'
            echo
            echo "#### E2E log"
            echo '```text'
            tail -n 120 artifacts/firefox-e2e.log 2>/dev/null || echo "E2E log unavailable"
            echo '```'
          } > artifacts/firefox-e2e-issue.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file artifacts/firefox-e2e-issue.md

      - name: Fail job if Firefox E2E failed
        if: always()
        env:
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
        run: test "${E2E_EXIT_CODE:-999}" = "0"
