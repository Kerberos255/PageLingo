name: LMT 0.6B hybrid benchmark

on:
  push:
    branches:
      - fix/github-font-size
    paths:
      - ".github/benchmarks/lmt_hybrid_bench.py"
      - ".github/workflows/lmt-hybrid-benchmark.yml"

permissions:
  contents: read

jobs:
  lmt-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify PageLingo
        run: |
          npm ci
          npm run verify

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: browser-actions/setup-geckodriver@latest

      - name: Install benchmark dependencies
        run: |
          python -m pip install selenium requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          python -m py_compile .github/benchmarks/lmt_hybrid_bench.py

      - name: Install and start LM Studio
        shell: bash
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
          LMS="$HOME/.lmstudio/bin/lms"
          "$LMS" daemon up
          sleep 5
          for i in $(seq 1 10); do "$LMS" server start --port 1234 && break; sleep 2; done
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:1234/api/v1/models >/dev/null && exit 0; sleep 2; done
          exit 1

      - name: Run LMT-60-0.6B Hybrid v2 benchmark
        run: python .github/benchmarks/lmt_hybrid_bench.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmt-0.6b-hybrid-benchmark
          path: lmt-hybrid-bench/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          lms server stop || true
          lms unload --all || true
          lms daemon down || true
