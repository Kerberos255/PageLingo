name: PageLingo Bergamot performance A-B

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Instrumented baseline commit/ref (before inference optimizations)"
        required: true
        type: string
      candidate_ref:
        description: "Candidate commit/ref (after inference optimizations)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        label: [baseline, candidate]

    steps:
      - name: Resolve benchmark ref
        id: target
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          LABEL: ${{ matrix.label }}
        run: |
          if [ "$LABEL" = "baseline" ]; then
            echo "ref=$BASELINE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package benchmark XPI
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path("dist/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          perms = data["browser_specific_settings"]["gecko"]["data_collection_permissions"]
          perms["required"] = ["websiteContent"]
          perms["optional"] = ["authenticationInfo"]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          npx web-ext build --source-dir dist --artifacts-dir artifacts --overwrite-dest
          PACKAGE="$(find artifacts -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$PACKAGE"
          cp "$PACKAGE" artifacts/pagelingo-perf.xpi

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.35.0

      - name: Benchmark live OpenClaw with local Bergamot
        run: python tests/openclaw_bergamot_perf.py artifacts/pagelingo-perf.xpi artifacts/${{ matrix.label }}.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: bergamot-perf-${{ matrix.label }}
          path: artifacts/${{ matrix.label }}.json
          retention-days: 7

  compare:
    runs-on: ubuntu-latest
    needs: benchmark
    steps:
      - name: Download baseline
        uses: actions/download-artifact@v4
        with:
          name: bergamot-perf-baseline
          path: perf/baseline

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: bergamot-perf-candidate
          path: perf/candidate

      - name: Compare
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          before = json.loads(Path("perf/baseline/baseline.json").read_text())
          after = json.loads(Path("perf/candidate/candidate.json").read_text())

          def change(key):
              a = float(before[key])
              b = float(after[key])
              pct = ((b - a) / a * 100.0) if a else 0.0
              return b - a, pct

          rows = []
          for key in ("rootCount", "inferenceCount", "translatedInputs", "inferenceMilliseconds", "elapsedMilliseconds"):
              delta, pct = change(key)
              rows.append(f"| {key} | {before[key]} | {after[key]} | {delta:+.3f} ({pct:+.1f}%) |")

          table = "\n".join([
              "| metric | baseline | candidate | delta |",
              "|---|---:|---:|---:|",
              *rows,
          ])
          print(table)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fh:
              fh.write("## OpenClaw Bergamot A/B\n\n" + table + "\n")
