<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="preferences-theme.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>PageLingo</title>
  </head>
  <body>
    <main>
      <header class="title-row">
        <div class="popup-brand">
          <img src="icons/pagelingo.png" alt="" width="28" height="28" />
          <h1>PageLingo</h1>
        </div>
        <div class="header-actions">
          <button id="open-reader" class="settings-button" type="button" title="打开文档 / PDF 阅读器">文档/PDF</button>
          <button id="settings" class="settings-button" type="button" aria-label="打开设置">设置</button>
        </div>
      </header>

      <nav class="popup-tabs" role="tablist" aria-label="功能切换">
        <button id="tab-page" type="button" role="tab" class="active" data-popup-tab="page" aria-selected="true" aria-controls="popup-panel-page">网页翻译</button>
        <button id="tab-text" type="button" role="tab" data-popup-tab="text" aria-selected="false" aria-controls="popup-panel-text">文本翻译</button>
      </nav>

      <section id="popup-panel-page" class="popup-panel" role="tabpanel" aria-labelledby="tab-page">
        <div id="pdf-open-banner" class="pdf-banner" hidden>
          <div class="pdf-banner-copy">
            <strong>检测到 PDF 文档</strong>
            <small>Firefox 限制扩展直接修改内置 PDF 页，请在阅读器中打开并保留公式翻译</small>
          </div>
          <button id="open-current-pdf" type="button" class="pdf-banner-btn">打开翻译</button>
        </div>

        <section class="language-pair" aria-label="翻译语言">
          <label class="language-box">
            <span>原文</span>
            <select id="source-language">
              <option value="auto">自动检测</option>
              <option value="en">English</option>
            </select>
          </label>
          <div class="arrow" aria-hidden="true">→</div>
          <label class="language-box">
            <span>译文</span>
            <select id="target-language">
              <option value="zh-Hans">简体中文</option>
            </select>
          </label>
        </section>

        <label class="engine-row" for="active-engine">
          <span>翻译引擎</span>
          <select id="active-engine" aria-label="选择翻译引擎">
            <option value="firefox-local">Firefox 本地翻译</option>
            <option value="builtin-microsoft-free">微软翻译</option>
            <option value="builtin-google-free">Google 翻译</option>
          </select>
        </label>

        <div class="display-switch" aria-label="显示模式">
          <button type="button" data-display-mode="translation">仅译文</button>
          <button type="button" data-display-mode="bilingual">双语对照</button>
        </div>

        <div class="page-actions">
          <button id="translate" class="primary" type="button">翻译本页</button>
          <button id="restore" class="secondary" type="button">显示原文</button>
        </div>

        <div class="site-auto-row">
          <span>
            <strong id="label-site-auto">在此网站自动翻译</strong>
            <small id="site-auto-hint"></small>
          </span>
          <label class="switch">
            <input id="site-auto" type="checkbox" disabled aria-labelledby="label-site-auto" />
            <i aria-hidden="true"></i>
          </label>
        </div>

        <p id="status" role="status"></p>
      </section>

      <section id="popup-panel-text" class="popup-panel" role="tabpanel" aria-labelledby="tab-text" hidden>
        <div class="text-translate-card" aria-label="文本翻译">
          <div class="text-translate-bar">
            <select id="text-source-language" aria-label="文本原文语言">
              <option value="auto">自动检测</option>
              <option value="en">English</option>
            </select>
            <button id="text-swap-language" class="text-swap-button" type="button" title="交换语言" aria-label="交换原文和译文语言">⇄</button>
            <select id="text-target-language" aria-label="文本译文语言">
              <option value="zh-Hans">简体中文</option>
            </select>
          </div>
          <div class="text-translate-body">
            <textarea id="text-translate-input" rows="4" placeholder="输入或粘贴要翻译的文本…（Enter 翻译，Shift+Enter 换行）"></textarea>
            <div class="text-translate-footer">
              <span id="text-translate-meta" class="text-translate-meta"></span>
              <div class="text-translate-actions">
                <button id="text-translate-clear" class="text-ghost-button" type="button" hidden>清空</button>
                <button id="text-translate-submit" class="text-submit-button" type="button">翻译 ↵</button>
              </div>
            </div>
          </div>
          <div id="text-translate-result-wrap" class="text-translate-result-wrap" hidden>
            <div id="text-translate-result" class="text-translate-result" role="region" aria-live="polite"></div>
            <div class="text-result-footer">
              <span id="text-translate-result-lang" class="text-translate-meta"></span>
              <div class="text-translate-actions">
                <button id="text-translate-retry" class="text-ghost-button" type="button" title="跳过缓存重新翻译">重译</button>
                <button id="text-translate-copy" class="text-ghost-button primary-ghost" type="button">复制</button>
              </div>
            </div>
          </div>
        </div>
        <div class="text-engine-foot">
          <span>当前引擎：</span>
          <strong id="text-engine-label">Firefox 本地翻译</strong>
        </div>
      </section>
    </main>
    <script src="builtin-glossary.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
