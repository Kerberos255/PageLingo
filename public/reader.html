<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="preferences-theme.css" />
    <link rel="stylesheet" href="reader.css" />
    <title>PageLingo 文档与 PDF 阅读器</title>
  </head>
  <body>
    <header class="reader-topbar">
      <div class="reader-brand">
        <img src="icons/pagelingo-32.png" width="24" height="24" alt="" />
        <strong>PageLingo 阅读器</strong>
        <span id="reader-doc-title" class="reader-doc-title">未打开文档</span>
      </div>

      <div class="reader-controls">
        <input id="reader-file-input" type="file" accept=".pdf,.epub,.docx,.md,.markdown,.html,.htm,.txt" hidden />
        <button id="reader-open-file" type="button" class="ghost-btn">打开文件</button>
        <select id="reader-source-lang" aria-label="原文语言">
          <option value="auto">自动检测</option>
          <option value="en">English</option>
        </select>
        <span class="reader-arrow" aria-hidden="true">→</span>
        <select id="reader-target-lang" aria-label="译文语言">
          <option value="zh-Hans">简体中文</option>
        </select>
        <div class="reader-mode-switch" role="group" aria-label="显示模式">
          <button type="button" data-reader-mode="translation">仅译文</button>
          <button type="button" data-reader-mode="bilingual" class="active">双语对照</button>
        </div>
        <button id="reader-translate" type="button" class="primary-btn" disabled>翻译文档</button>
        <button id="reader-restore" type="button" class="ghost-btn" disabled>显示原文</button>
        <button id="reader-open-settings" type="button" class="ghost-btn">设置</button>
      </div>
    </header>

    <div class="reader-statusbar">
      <span id="reader-status" role="status">拖入本地 PDF / EPUB / DOCX / Markdown / HTML 文件，或从弹窗一键打开当前 PDF</span>
      <div id="reader-pdf-tools" class="reader-pdf-tools" hidden>
        <button id="reader-zoom-out" type="button" class="mini-btn" title="缩小">−</button>
        <span id="reader-zoom-label">100%</span>
        <button id="reader-zoom-in" type="button" class="mini-btn" title="放大">+</button>
      </div>
    </div>

    <main id="reader-stage" class="reader-stage">
      <section id="reader-empty" class="reader-empty">
        <div id="reader-dropzone" class="reader-dropzone" tabindex="0" role="button" aria-label="点击或拖入文档打开">
          <div class="drop-icon" aria-hidden="true">PDF / DOC</div>
          <h1>本地文档与 PDF 保真翻译阅读器</h1>
          <p>在浏览器本地解析文档结构与数学公式，不上传原文件。支持双语对照、专业术语保护与原页同步高亮。</p>
          <div class="format-badges">
            <span>PDF（双栏 + 公式保护）</span>
            <span>EPUB 电子书</span>
            <span>DOCX（含公式）</span>
            <span>Markdown / LaTeX</span>
            <span>HTML / TXT</span>
          </div>
          <div class="drop-actions">
            <button id="reader-pick-primary" type="button" class="primary-btn">选择本地文件</button>
          </div>
          <form id="reader-url-form" class="url-form">
            <input id="reader-url-input" type="url" placeholder="或输入在线 PDF / Markdown 链接 (https://...)" />
            <button type="submit" class="ghost-btn">加载链接</button>
          </form>
        </div>
      </section>

      <section id="pdf-workspace" class="pdf-workspace" hidden>
        <div id="pdf-canvas-pane" class="pdf-canvas-pane" aria-label="PDF 原文页面"></div>
        <div id="pdf-text-pane" class="pdf-text-pane" aria-label="PDF 结构化译文"></div>
      </section>

      <section id="doc-workspace" class="doc-workspace" hidden>
        <aside id="doc-toc-pane" class="doc-toc-pane" hidden>
          <div class="toc-title">目录</div>
          <nav id="doc-toc-list" class="doc-toc-list"></nav>
        </aside>
        <article id="doc-content" class="doc-content"></article>
      </section>
    </main>

    <script src="builtin-glossary.js"></script>
    <script src="reader.js"></script>
  </body>
</html>
